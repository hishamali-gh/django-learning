{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
    <h2>Sign In to Your Account</h2>

    {% if error %}
        <p style="color: #ef4444; background: #451a1a; padding: 10px; border-radius: 4px;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div style="margin-bottom: 15px;">
            <label>Username:</label><br>

            <input type="text" name="username" required style="padding: 8px; width: 250px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Password:</label><br>

            <input type="password" name="password" required style="padding: 8px; width: 250px;">
        </div>

        <button type="submit" style="padding: 10px 20px; background: #38bdf8; border: none; font-weight: bold; cursor: pointer; border-radius: 4px;">Log In</button>
    </form>
{% endblock %}
